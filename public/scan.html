<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrôle d'entrée</title><link rel="stylesheet" href="s.css">
<script src="html5-qrcode.min.js"></script>
<main><h1>Contrôle d'entrée</h1><label>Clé scan<input id="k" type="password"></label><button id="s">Démarrer la caméra</button><div id="reader"></div><div id="res" class="res">En attente</div></main>
<script>
const $=i=>document.getElementById(i);let busy=false;$("k").value=sessionStorage.k||"";
$("s").onclick=()=>{sessionStorage.k=$("k").value;new Html5Qrcode("reader").start({facingMode:"environment"},{fps:10,qrbox:250},async t=>{
if(busy)return;busy=true;const r=await fetch("/api/scan",{method:"POST",headers:{"x-key":$("k").value},body:JSON.stringify({code:t})}),d=await r.json(),e=$("res");
e.className="res "+(d.ok?"ok":"ko");
e.textContent=r.status===401?"Clé refusée":d.ok?"VALIDE : "+d.name+" ("+d.label+")":"REFUSÉ : "+d.reason+(d.name?" – "+d.name:"")+(d.at?" à "+new Date(d.at).toLocaleTimeString("fr-FR"):"");
setTimeout(()=>busy=false,2500)}).catch(x=>$("res").textContent="Caméra impossible : "+x)};
</script>
